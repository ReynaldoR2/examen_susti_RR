<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Examen Sustitutorio</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">LISTADO DE MASCOTAS</h1>
        <a th:href="@{/mascota/nuevo}" class="btn btn-secondary">+ NUEVA MASCOTA</a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

	<form th:action="@{/mascota/listado}" method="get" class="card card-body mb-4">
	    <div class="d-flex justify-content-between align-items-end">
	        <div>
	            <label class="form-label fw-semibold">Especie</label>
	            <select name="especie" class="form-select">
	                <option value="">--Todos--</option>
	                <option value="C" th:selected="${filter.especie() == 'C'}">Canino</option>
	                <option value="F" th:selected="${filter.especie() == 'F'}">Felino</option>
	                <option value="A" th:selected="${filter.especie() == 'A'}">Ave</option>
	            </select>
	        </div>
	        <div>
	            <button type="submit" class="btn btn-secondary">BUSCAR</button>
	            <a th:href="@{/mascota/listado}" class="btn btn-light border">LIMPIAR</a>
	        </div>
	    </div>
	</form>

    <table class="table table-bordered align-middle">
        <thead class="table-light">
            <tr>
                <th>Id</th>
                <th>Mascota</th>
                <th>Especie</th>
                <th>Raza</th>
                <th>Dueño</th>
                <th>Fecha de nacimiento</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="m : ${lstMascota}">
                <td th:text="${m.idMascota}"></td>
                <td th:text="${m.nomMascota}"></td>
                <td th:text="${m.especie == 'C' ? 'Canino' : (m.especie == 'F' ? 'Felino' : 'Ave')}"></td>
                <td th:text="${m.raza}"></td>
                <td th:text="${m.dueno.nomDueno + ' ' + m.dueno.apeDueno}"></td>
                <td th:text="${m.fechaNac}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(lstMascota)}">
                <td colspan="6" class="text-center text-muted">No hay mascotas registradas.</td>
            </tr>
        </tbody>
    </table>
</body>
<th:block th:utext="${alert}" ></th:block>
</html>
